name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

# Trusted Publishing (docs/adr-nuget/NUGET-0004): nuget.org entrega una llave temporal a
# cambio del token OIDC de este workflow. No hay ninguna llave de NuGet guardada en el repo.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tag matches version file
        run: |
          expected="v$(tr -d '[:space:]' < version)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version file ($expected)"; exit 1
          fi

      - name: Stable dependencies only
        run: python3 scripts/check-prerelease-deps.py

      - name: Restore
        run: dotnet restore Common.slnx

      - name: Test
        run: dotnet test Common.slnx --configuration Release --no-restore

      - name: Pack
        run: dotnet pack Common.slnx --configuration Release --no-restore -o artifacts

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
