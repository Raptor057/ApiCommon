name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Stable dependencies only
        run: python3 scripts/check-prerelease-deps.py

      - name: Restore
        run: dotnet restore Common.slnx

      - name: Test
        run: dotnet test Common.slnx --configuration Release --no-restore

      - name: Pack
        run: dotnet pack Common.slnx --configuration Release --no-restore -o artifacts
